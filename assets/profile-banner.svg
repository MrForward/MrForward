<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Krishna Chaitanya — Product leader and AI builder</title>
  <desc id="desc">A dark navy banner with teal and amber accents and the words Turning ambiguous problems into useful products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="0.52" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#14213D"/>
    </linearGradient>
    <radialGradient id="teal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1032 66) rotate(142) scale(420 250)">
      <stop stop-color="#2DD4BF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(106 332) rotate(-35) scale(390 245)">
      <stop stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#teal)"/>
  <rect width="1200" height="360" rx="28" fill="url(#amber)"/>
  <g opacity="0.9">
    <circle cx="1009" cy="108" r="58" stroke="#5EEAD4" stroke-opacity="0.44" stroke-width="2"/>
    <circle cx="1009" cy="108" r="92" stroke="#5EEAD4" stroke-opacity="0.16"/>
    <path d="M954 240C1000 197 1054 184 1112 202" stroke="#FBBF24" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="954" cy="240" r="5" fill="#FBBF24"/>
    <circle cx="1112" cy="202" r="5" fill="#5EEAD4"/>
  </g>
  <text x="84" y="94" fill="#5EEAD4" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" letter-spacing="3">PRODUCT LEADER  /  AI BUILDER  /  0–1 OPERATOR</text>
  <text x="80" y="182" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="750" letter-spacing="-1.5">Krishna Chaitanya</text>
  <text x="84" y="244" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="450">Turning ambiguous problems into useful products.</text>
  <rect x="84" y="288" width="92" height="5" rx="2.5" fill="#2DD4BF"/>
  <rect x="184" y="288" width="38" height="5" rx="2.5" fill="#F59E0B"/>
</svg>
